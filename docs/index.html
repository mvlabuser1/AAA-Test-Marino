<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My GitHub Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
        }
        header {
            background-color: #24292f;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My GitHub Page</h1>
    <p>Hosted with GitHub Pages 🚀</p>
</header>

<main>
    <h2>About</h2>
    <p>
        This is a simple static website hosted on GitHub Pages.
        You can edit this page by changing the <strong>index.html</strong> file in the repository.
    </p>

    <h2>Links</h2>
    <ul>
        <li><a href="https://github.com">GitHub</a></li>
        <li><a href="https://pages.github.com">GitHub Pages</a></li>
    </ul>
</main>

<footer>
    © 2026 • Your Name
</footer>

</body>
</html>
